# --- Насичений яскравий неон на чистому чорному тлі ---
background            #000000
foreground            #ffffff
cursor                #00bfff
cursor_text_color     #000000

# Границі вікна Kitty (під колір яскравого неону)
active_border_color   #00bfff
inactive_border_color #222222

# Вимикаємо прозорість, щоб тло було максимально глибоким чорним
background_opacity    1.0
dynamic_background_opacity no

# --- Ультра-яскраві ANSI кольори ---
color0  #000000
color8  #555555
# Яскраво-червоний
color1  #ff0055
color9  #ff3377
# Кислотно-зелений
color2  #00ff99
color10 #33ffaa
# Неоново-жовтий
color3  #ffff00
color11 #ffff55
# Глибокий соковитий синій
color4  #0066ff
color12 #3388ff
# Отруйно-фіолетовий (під твій новий стиль)
color5  #a020f0
color13 #d300ff
# Яскравий ціан / блакитний (акцент)
color6  #00bfff
color14 #00ffff
# Чистий білий
color7  #ffffff
color15 #ffffff

# --- Шрифт ---
font_family      JetBrainsMono Nerd Font
font_size        11.0
window_padding_width 10

# Жорстка фіксація запуску Bash
shell /bin/bash
